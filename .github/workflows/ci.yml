name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test-build:
    name: Lint, testes e build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o Node (versão do .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        run: npm run build